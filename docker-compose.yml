services:
  postgres:
    image: postgres:16-alpine
    container_name: dev-burger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devburger
      POSTGRES_PASSWORD: devburger
      POSTGRES_DB: devburger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devburger -d devburger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
